<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noticias San Martín - 3 de Febrero - EN VIVO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f5f5f5;color:#111}
header{background:#111;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
header h1{font-size:18px;letter-spacing:.5px}
header h1 span{color:#C8102E}
.live{color:#4CAF50;font-weight:800;animation:blink 1.2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
main{max-width:900px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:12px;padding:16px;margin:12px 0;box-shadow:0 2px 8px rgba(0,0,0,.08);border-left:6px solid #0D47A1}
.card.hot{border-left-color:#C8102E;background:#fff5f5}
.card.tdf{border-left-color:#00695C}
.badge{display:inline-block;font-size:11px;font-weight:800;padding:3px 8px;border-radius:20px;margin-bottom:6px}
.badge.SM{background:#0D47A1;color:#fff}
.badge.TDF{background:#00695C;color:#fff}
.badge.HOT{background:#C8102E;color:#fff}
.badge.CB{background:#555;color:#fff}
h2{font-size:18px;line-height:1.3;margin:4px 0 8px}
p{font-size:14px;color:#444;line-height:1.4}
.meta{font-size:12px;color:#888;margin-top:8px;display:flex;gap:10px;flex-wrap:wrap}
a{color:#0D47A1;text-decoration:none;font-weight:600}
.loading{text-align:center;padding:40px;color:#666}
footer{text-align:center;padding:20px;color:#888;font-size:12px}
</style>
</head>
<body>
<header>
<h1>NOTICIAS <span>SAN MARTÍN</span> · 3 DE FEBRERO</h1>
<div class="live">● EN VIVO</div>
</header>
<main>
<div id="status" class="loading">Cargando noticias en vivo...</div>
<div id="news"></div>
</main>
<footer>
<a href="https://www.facebook.com/NoticiasSanMartinTresDeFebrero" target="_blank">Facebook</a> · 
Actualizado por Bot Autónomo · 
<a href="noticias.json" target="_blank">Ver JSON</a>
</footer>
<script>
function timeAgo(iso){
 try{
  const d=new Date(iso);
  const diff=Math.floor((Date.now()-d)/1000);
  if(diff<60) return "hace "+diff+"s";
  if(diff<3600) return "hace "+Math.floor(diff/60)+" min";
  if(diff<86400) return "hace "+Math.floor(diff/3600)+" hs";
  return "hace "+Math.floor(diff/86400)+" días";
 }catch(e){return ""}
}
async function load(){
 const status=document.getElementById('status');
 const container=document.getElementById('news');
 try{
  const res=await fetch('noticias.json?v='+Date.now(),{cache:'no-store'});
  if(!res.ok) throw new Error(res.status);
  const data=await res.json();
  if(!data.length) throw new Error("vacio");
  status.style.display='none';
  container.innerHTML=data.map(n=>{
   let cls=n.localidad && n.localidad.includes('TRES')?'tdf':(n.hot?'hot':'');
   let badgeClass=n.localidad && n.localidad.includes('TRES')?'TDF':(n.hot?'HOT':(n.localidad && n.localidad.includes('CONURBANO')?'CB':'SM'));
   let badgeText=n.hot?'🔥 HOT':(n.localidad||'SAN MARTÍN');
   return `<div class="card ${cls}">
    <div class="badge ${badgeClass}">${badgeText}</div>
    <h2>${n.titulo||'Sin titulo'}</h2>
    <p>${n.resumen||''}</p>
    <div class="meta">
     <span>📍 ${n.localidad||''}</span>
     <span>🕒 ${timeAgo(n.fecha)}</span>
     <span>📰 ${n.fuente||''}</span>
     ${n.link?`<a href="${n.link}" target="_blank">Ver fuente →</a>`:''}
     ${n.facebook_post?`<a href="${n.facebook_post}" target="_blank">Ver en FB →</a>`:''}
    </div>
   </div>`;
  }).join('');
 }catch(e){
  status.innerHTML=`Error cargando noticias: ${e.message} <br><a href="noticias.json">Ver noticias.json directo</a>`;
  console.error(e);
 }
}
load();
setInterval(load, 60000);
</script>
</body>
</html>
